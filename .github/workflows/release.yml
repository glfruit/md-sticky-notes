# 发布管线：推 v* tag → 双架构 macOS DMG → draft release（人工在 Releases 页放行）
# 签名双模式（2026-10-23，ADR-0002 修订：$99 投入推迟）：
#   - 未配置付费证书（当前态）：ad-hoc 签名分发，用户首次打开需在「系统设置 → 隐私与安全性」放行
#   - 配置 APPLE_CERTIFICATE 等 secrets 后：自动升级为 Developer ID 签名 + 公证（wizard-03 负责配置）
# 票04 将在此追加 updater 产物（.app.tar.gz + latest.json）；票08 加 windows-latest 矩阵项产 NSIS。
name: release

on:
  push:
    tags: ['v*']

jobs:
  build-macos:
    permissions:
      contents: write
    timeout-minutes: 60 # 公证等待（notarytool --wait）无 SLA，给足余量
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # arm64（Apple Silicon）
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel 版在 arm64 runner 上交叉编译（官方示例做法）
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # 模式判定：有付费证书 → Developer ID + 公证；没有 → ad-hoc（Tauri 无凭据会静默不签，
      # Apple Silicon 会判 damaged，所以 ad-hoc 身份必须显式注入，两种模式都有产物验收）
      - name: 签名模式判定
        id: creds
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "mode=cert" >> "$GITHUB_OUTPUT"
            echo "检测到 APPLE_CERTIFICATE：Developer ID 签名 + 公证模式。"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "未配置付费签名：ad-hoc 分发模式（用户首次打开需手动放行，README 有指引）。"
            echo "配置 secrets 后本管线自动升级为签名+公证（见 .scratch/release/wizard-03-apple-signing.sh）。"
          fi

      - name: ad-hoc 模式：注入签名身份
        if: steps.creds.outputs.mode == 'adhoc'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: cert 模式：注入签名/公证凭据
        if: steps.creds.outputs.mode == 'cert'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"
            echo "$APPLE_CERTIFICATE"
            echo "CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}"
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "${{ secrets.APPLE_API_KEY_P8 }}" > "$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 产物验收（按模式）：cert 模式要求 Developer ID + Notarized + staple 齐全；
      # adhoc 模式要求 ad-hoc 签名在位（缺失则 Apple Silicon 判 damaged）。
      # tauri-action 已把资产传到 draft release：红灯即代表该 draft 不可发布。
      - name: 校验签名
        run: |
          APP=$(ls -d src-tauri/target/*/release/bundle/macos/*.app | head -1)
          DMG=$(ls src-tauri/target/*/release/bundle/dmg/*.dmg | head -1)
          echo "校验对象：$APP / $DMG"
          if [ "${{ steps.creds.outputs.mode }}" = "cert" ]; then
            codesign -dv "$APP" 2>&1 | grep -q "Developer ID Application" \
              || { echo "::error::产物不是 Developer ID 签名"; exit 1; }
            spctl -a -vv -t open "$APP" 2>&1 | grep -q "Notarized Developer ID" \
              || { echo "::error::spctl 未显示 Notarized Developer ID（公证缺失？）"; exit 1; }
            xcrun stapler validate "$APP" || { echo "::error::.app staple 校验失败"; exit 1; }
            xcrun stapler validate "$DMG" || { echo "::error::DMG staple 校验失败"; exit 1; }
          else
            codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" \
              || { echo "::error::ad-hoc 签名缺失，Apple Silicon 用户会看到「已损坏」"; exit 1; }
          fi
